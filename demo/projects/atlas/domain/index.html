  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Minor 4 (финальное ревью поставки 1): `color-scheme` больше не
         статичен — тема переключаемая (`useTheme`), и живёт в CSS-токенах
         (tokens.css: `color-scheme: light` в `:root`, `dark` в `.dark`).
         Зашитый сюда `content="dark"` держал светлую тему со скроллбарами
         и form-контролами тёмной ОС-палитры. -->
    <title>Freim Deploy</title>

    <!-- Первая краска темы. Раньше здесь стоял зашитый `class="dark"`, и
         владелец, выбравший светлую тему, получал чёрную вспышку на каждой
         загрузке: класс снимался только когда доезжал и исполнялся
         `main.tsx` с его `initTheme('dark')`. Скрипт синхронный, без `defer`
         и стоит ДО стилей — браузер не рисует ни кадра, пока он не отработал,
         поэтому вспышки нет в принципе.
         Правило приоритета то же, что у `initTheme`/`useTheme`
         (`packages/ui/src/hooks/use-theme.ts`): сохранённый выбор важнее
         дефолта приложения. Ключ `fd-theme` и дефолт `dark` продублированы
         здесь намеренно — модуль сюда не импортировать, иначе вернётся та же
         вспышка, ради которой скрипт и написан. Замок на эту пару:
         `ui/src/lib/__tests__/theme-first-paint.test.ts`.
         localStorage бросает в приватных режимах и при запрете cookie —
         молчаливый `catch` оставляет дефолт приложения, что честнее белого
         экрана. -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('fd-theme');
          var theme = stored === 'dark' || stored === 'light' || stored === 'system' ? stored : 'dark';
          var dark =
            theme === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
              : theme === 'dark';
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <!-- Иконки и og-картинка. Файлы физически лежат в `assets/brand/` —

         обслуживается с корня своего поддомена. -->
